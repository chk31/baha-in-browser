<!DOCTYPE html>
<html lang="ja">
<head>

<style>
:root{--bg:#fff4dc;--ink:#151515;--mon:#ffd23f;--spl:#8fd3ff;--act:#dedede;--red:#ff4d4d;--pur:#b48cff;--sh:3px 3px 0 var(--ink);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:'Zen Maru Gothic',system-ui,sans-serif;font-weight:700}
body{background-image:radial-gradient(#15151514 1px,transparent 1px);background-size:14px 14px}
#app{height:100vh;height:100dvh;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:7px;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 10px)}
header{display:flex;align-items:center;gap:6px;flex:none}
h1{font-size:16px;font-weight:900;margin:0 auto 0 0;white-space:nowrap}h1 span{background:var(--ink);color:var(--mon);padding:0 5px;margin-left:3px}
button{font:inherit;font-weight:900;border:2.5px solid var(--ink);background:#fff;color:var(--ink);padding:7px 11px;box-shadow:var(--sh);cursor:pointer;border-radius:0}

button.pri{background:var(--mon)}button.danger{background:var(--red);color:#fff}button.sm{padding:3px 8px;font-size:12px}

.chip{width:13px;height:13px;border:2px solid var(--ink);background:var(--pur);display:inline-block;transform:rotate(45deg);margin:0 2px}

.mid{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px;flex:none}

#detail .dart{width:42px;height:42px;flex:none}

.card{border:2.5px solid var(--ink);box-shadow:var(--sh);background:var(--act);position:relative;cursor:pointer;display:flex;flex-direction:column;overflow:visible;padding:3px}
.card.まもの{background:var(--mon)}.card.呪文{background:var(--spl)}

.bar{display:flex;gap:10px;flex:none}.bar button{flex:1;font-size:15px;padding:10px}
.ov{position:fixed;inset:0;background:#151515aa;display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
.ov.ref{z-index:30}
.modal{background:var(--bg);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);max-width:520px;width:100%;max-height:calc(100dvh - 28px);overflow:auto;padding:14px}
.modal h2{margin:0 0 6px;font-size:17px;font-weight:900}
.modal p{font-size:13px;font-weight:500;margin:6px 0}
.modal .btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.modal .btns button{flex:1}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:9px;margin-top:8px}
.opts .card{height:112px;--fs:10.5px}
.opts .lbl{font-size:10px;font-weight:900;margin-bottom:3px}
.mdet{min-height:44px;background:#fff;border:2px solid var(--ink);padding:5px 8px;font-size:12px;font-weight:500;margin-top:10px}
.big{display:flex;gap:10px;align-items:center;background:#fff;border:2.5px solid var(--ink);padding:8px}
.big .card{width:96px;height:130px;flex:none;cursor:default;--fs:11px}
.big .tx{font-size:13px;font-weight:500}
.names{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}

.title-big{font-size:28px;font-weight:900;line-height:1.1;margin:4px 0 8px}
.rules li{font-size:12.5px;font-weight:500;margin:3px 0}
.reflist{display:grid;gap:7px}

.refc .t{font-size:10px;border:1.5px solid var(--ink);padding:0 3px;margin-right:4px}
.refc .n{font-weight:900;font-size:13px}.refc .x{font-size:11.5px;font-weight:500}
.refc.まもの{background:#fff6cc}.refc.呪文{background:#e3f4ff}
.log div{font-size:12px;font-weight:500;padding:1px 0}.log .turn{font-weight:900;margin-top:4px}.log .play{font-weight:900}.log .neg{color:#7b3fe4;font-weight:900}.log .hit{color:#c62828;font-weight:900}.log .sys{opacity:.6}.log .rule,.sum .rule{color:#1565c0;font-weight:900}.log .win{font-weight:900}
.sum{background:#fff;border:2.5px solid var(--ink);padding:6px 8px;margin-top:6px}
.sum div{font-size:13px;font-weight:500;padding:2px 0;border-bottom:1px dashed #ccc}.sum div:last-child{border:0}
.sum .play{font-weight:900}.sum .neg{color:#7b3fe4;font-weight:900}.sum .hit{color:#c62828;font-weight:900}
.endhead{background:#c62828;color:#fff;margin:-14px -14px 10px;padding:12px 14px;font-size:20px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.endhead small{font-size:12px;font-weight:700;opacity:.9}
.lifecmp{display:flex;gap:10px;margin-top:8px}.lifecmp>div{flex:1;background:#fff;border:2px solid var(--ink);padding:5px;font-size:12px;text-align:center}
.tarts .art{width:100%;height:100%;display:block}
.names button.known{background:#ffe0e6;border-color:#c62828;box-shadow:3px 3px 0 #c62828}
.names button.out{opacity:.4;box-shadow:none;background:#eee}
.names .nt{display:flex;flex-direction:column;line-height:1.2}.names .nt small{font-size:9.5px;font-weight:700;opacity:.75}
.names button.known .nt small{color:#c62828;opacity:1}
.nleg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.nb{font-size:10.5px;border:1.5px solid var(--ink);padding:1px 5px;background:#fff}.nb.known{background:#ffe0e6;border-color:#c62828;color:#c62828}.nb.out{opacity:.45;background:#eee}
.ov.peek{background:transparent;pointer-events:none}
.ov.peek .modal{display:none}
.peekbar{display:none}
.ov.peek .peekbar{display:flex;pointer-events:auto;position:fixed;left:0;right:0;bottom:0;gap:10px;align-items:center;z-index:25;background:var(--ink);color:#fff;
  padding:10px calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 10px);border-top:3px solid var(--mon)}
.peekbar .pt{flex:1;font-size:13px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peekbar button{flex:none;font-size:14px}
.peekbtn{float:right;margin:-4px -4px 8px 10px;background:#e8f7ff}
.card.aif{outline:3px solid #1565c0;outline-offset:2px}
button.aih{outline:3px solid #1565c0;outline-offset:2px;position:relative}
.card.aif::after,button.aih::after{content:"AI";position:absolute;background:#1565c0;color:#fff;font-size:11px;font-weight:900;line-height:1;padding:3px 6px;border:2px solid var(--ink);z-index:3;letter-spacing:.5px}
.card.aif::after{bottom:30px;right:-8px}
button.aih::after{top:-11px;right:-8px}
.banner div+div{margin-top:3px;border-top:1px dashed #ffffff55;padding-top:3px}
.setrow{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:12px;font-weight:500}
.setrow button{flex:none}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (min-width:700px){h1{font-size:20px}.mini{height:40px;font-size:13px}.mini .art{width:36px;height:36px}.field{min-height:42px}#detail{height:60px;font-size:13.5px}#detail .dart{width:50px;height:50px}.status{font-size:15px}.pill{font-size:13px}}
#lv button{white-space:nowrap;padding-left:2px;padding-right:2px;min-width:0;flex:1 1 0;font-size:14px}
.bdg{display:block;margin:3px auto 0;width:fit-content;font-size:10px;line-height:1;padding:2px 5px;border:1.5px solid #151515;border-radius:9px;background:#fff;color:#151515;font-weight:700}
.bdg.none{border-style:dashed;color:#888;border-color:#888}
button.pri .bdg{background:#151515;color:#fff;border-color:#fff}
.reclist{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto}.recrow{display:grid;grid-template-columns:7em 2.8em 2.6em 2.6em 1fr;white-space:nowrap;gap:4px;text-align:left;font-size:13px;padding:8px 10px;align-items:center}.recrow b.w{color:#c0392b}.recrow b.l{color:#555}
</style>

<script>

// ===== 効果音（Web Audioで合成） =====
const SFX={ctx:null,on:true};
try{if(localStorage.getItem('hb_sound')==='off')SFX.on=false;}catch(e){}
function actx(){
  if(!SFX.ctx){try{SFX.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(SFX.ctx.state==='suspended'){try{SFX.ctx.resume();}catch(e){}}
  return SFX.ctx;
}
function tone(f,dur,type='square',vol=0.07,at=0,slide=0){
  if(!SFX.on)return;const c=actx();if(!c)return;
  const t=c.currentTime+at,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol=0.12,at=0){
  if(!SFX.on)return;const c=actx();if(!c)return;
  const t=c.currentTime+at,n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(),g=c.createGain(),fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1400;
  s.buffer=b;g.gain.value=vol;s.connect(fl).connect(g).connect(c.destination);s.start(t);
}
const sfx={
  tap(){tone(620,0.05,'square',0.045);},
  select(){tone(880,0.05,'triangle',0.08);tone(1320,0.05,'triangle',0.05,0.04);},
  play(){tone(523,0.07,'square',0.06);tone(784,0.1,'square',0.06,0.07);},
  cpuPlay(){tone(392,0.07,'square',0.05);tone(330,0.1,'square',0.05,0.07);},
  negate(){tone(880,0.18,'sawtooth',0.05,0,-600);tone(220,0.12,'square',0.04,0.12);},
  hit(){noise(0.18,0.16);tone(140,0.16,'square',0.07,0,-60);},
  hara(){tone(110,0.45,'sawtooth',0.08,0,-50);noise(0.35,0.12,0.05);},
  turnYou(){tone(659,0.08,'triangle',0.08);tone(988,0.14,'triangle',0.08,0.09);},
  turnCpu(){tone(330,0.08,'triangle',0.06);tone(247,0.14,'triangle',0.06,0.09);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,0.16,'square',0.06,i*0.11));tone(1319,0.35,'triangle',0.07,0.46);},
  lose(){[392,349,311,262].forEach((f,i)=>tone(f,0.2,'triangle',0.07,i*0.16));},
};
function updSnd(){const b=document.getElementById('sndBtn');if(b)b.textContent=SFX.on?'音ON':'音OFF';}
document.addEventListener('pointerdown',e=>{
  actx();
  const t=e.target;
  if(t.closest('#sndBtn'))return;
  if(t.closest('button')){if(!t.closest('button').disabled)sfx.tap();}
  else if(t.closest('.card,.mini'))sfx.select();
},true);
const G={s:null,sel:null,info:null,awaitPlay:null,level:8,hint:false,rules:true,aiPlay:undefined};
try{G.hint=localStorage.getItem('hb_hint')==='on';G.rules=localStorage.getItem('hb_rules')!=='off';}catch(e){}
// AIのおすすめ（自分＝プレイヤー0の視点だけで判断。ONのときだけ計算する）
function aiAdvice(fn){try{return fn(makeAI65());}catch(e){return null;}}
const aiLine=()=>'';
G.stat={n:0,m:0,k:{}};
function recStat(kind,ok){if(ok===null||ok===undefined)return;const S=G.stat;S.n++;if(ok)S.m++;const k=S.k[kind]||(S.k[kind]=[0,0]);k[1]++;if(ok)k[0]++;}
let RL_NET5=null;const getRL5=()=>RL_NET5||(RL_NET5=rlLoad(RL_WEIGHTS5));let RL_NET6=null;const getRL6=()=>RL_NET6||(RL_NET6=rlLoad(RL_WEIGHTS6));let RL_NET65=null;const getRL65=()=>RL_NET65||(RL_NET65=rlLoad(RL_WEIGHTS65));
const ruleWrap=(ai,lg=false)=>G.rules?withRules(ai,{log:lg}):ai;
const makeAI5=(lg=false)=>ruleWrap(makeRL(getRL5()),lg);
const makeAI6=(lg=false)=>ruleWrap(makeRL(getRL6()),lg);
const makeAI65=(lg=false)=>ruleWrap(makeRL(getRL65()),lg);
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const heartSVG=on=>`<svg class="heart" viewBox="0 0 16 15"><path d="M8 14 1.5 7.5A3.8 3.8 0 0 1 8 2.6a3.8 3.8 0 0 1 6.5 4.9Z" fill="${on?'#ff4d4d':'none'}" stroke="#151515" stroke-width="2" opacity="${on?1:.3}"/></svg>`;
function cardHTML(c,cls='',badge=''){const d=CARDS[c];return `<div class="card ${d.type} ${cls}" data-c="${c}">${badge}<span class="tag">${d.type}</span>${artSVG(c)}<span class="nm">${esc(d.name)}</span></div>`;}
const miniHTML=c=>`<span class="mini ${CARDS[c].type}" data-c="${c}">${artSVG(c)}${esc(CARDS[c].name)}</span>`;
const refHTML=c=>{const d=CARDS[c];return `<div class="refc ${d.type}">${artSVG(c)}<div><span class="t">${d.type}</span><span class="n">${esc(d.name)}</span><div class="x">${esc(d.text)}</div></div></div>`;};
function lifeChips(pl){return `<span class="stat">${[0,1,2,3].map(i=>heartSVG(i<pl.life)).join('')}</span><span class="stat">書${'<span class="chip"></span>'.repeat(pl.chips)}${pl.chips===0?'<span class="chip off"></span>':''}${pl.chips}</span>`;}
const detailHTML=c=>c==null?`<span class="hint">カードをタップすると効果が表示されます</span>`:`<svg class="dart" viewBox="0 0 100 100">${ART[c]}</svg><div><span class="dn">${esc(CARDS[c].name)}</span>（${CARDS[c].type}）<br>${esc(CARDS[c].text)}</div>`;

function layoutHand(n){
  const box=$('hand');const W=box.clientWidth,H=box.clientHeight,gap=8,a=0.74;
  if(!n||W<10||H<10)return;
  let best={sz:0,cols:1,cw:0,ch:0};
  for(let cols=1;cols<=n;cols++){const rows=Math.ceil(n/cols);const cw=(W-gap*(cols-1))/cols,ch=(H-gap*(rows-1)-6)/rows;
    const w=Math.min(cw,ch*a,190);if(w>best.sz)best={sz:w,cols,cw:w,ch:w/a};}
  box.style.gridTemplateColumns=`repeat(${best.cols},${best.cw}px)`;
  box.querySelectorAll('.card').forEach(el=>{el.style.width=best.cw+'px';el.style.height=best.ch+'px';el.style.setProperty('--fs',Math.max(9,Math.min(15,best.cw*0.094))+'px');});
}
function render(){
  const s=G.s;if(!s){$('hand').innerHTML='';return;}
  const me=s.players[0],cpu=s.players[1];
  const knownCPU=[...s.known[0]];
  $('cpuPanel').innerHTML=`<div class="row"><span class="who">CPU</span><span class="backs">${cpu.hand.map(()=>'<span class="back"></span>').join('')}</span>${lifeChips(cpu)}</div>
    ${knownCPU.length?`<div class="backs" style="margin-top:4px"><span class="peek">CPU手札で判明：${knownCPU.map(c=>esc(CARDS[c].name)).join('・')}</span></div>`:''}
    <div class="field">${cpu.field.length?cpu.field.map(miniHTML).join(''):'<span class="empty">CPUの場：なし</span>'}</div>`;
  $('youPanel').innerHTML=`<div class="field" style="margin-top:0">${me.field.length?me.field.map(miniHTML).join(''):'<span class="empty">あなたの場：なし</span>'}</div>
    <div class="row" style="margin-top:5px"><span class="who">あなた</span>${lifeChips(me)}</div>`;
  const myTurn=s.turn===0&&s.winner==null;
  const stCls=s.winner!=null?'':myTurn?'you':'cpu';
  const stTxt=s.winner!=null?(s.winner===0?'あなたの勝ち！':'CPUの勝ち')+' ▸結果':`${myTurn?'あなた':'CPU'}のターン・残り${Math.max(0,s.playsAllowed-s.playsUsed)}`;
  $('mid').innerHTML=`<div class="status ${stCls}${s.winner!=null?' click':''}" id="stBox">${stTxt}</div><div class="pill"><b>${s.deck.length}</b>山札</div><div class="pill click" id="discBox"><b>${s.discard.length}</b>捨て札▸</div><div class="pill"><b>${s.stock}</b>ストック</div>`;
  $('discBox').onclick=showDiscard;
  if(s.winner!=null&&G.result)$('stBox').onclick=()=>showResult();

async function startGame(first){
  const s=newGame(first,Math.random,['あなた','CPU']);G.s=s;G.result=null;G.stat={n:0,m:0,k:{}};G.sel=null;G.info=null;G.awaitPlay=null;
  let lastLen=0,turnStart=0,lifeBefore=[4,4];
  s.hooks.update=async(kind)=>{
    stale(s);render();
    const fresh=s.log.slice(lastLen);lastLen=s.log.length;
    const cpuTurn=s.turn===1;
    if(kind==='turn'){G.snaps.push(gameSnap(s));turnStart=s.log.length-1;lifeBefore=[s.players[0].life,s.players[1].life];banner(cpuTurn?'CPUのターン':'あなたのターン');cpuTurn?sfx.turnCpu():sfx.turnYou();if(cpuTurn)await sleep(700);return;}
    const show=fresh.filter(l=>l.cls!=='turn'&&l.cls!=='rule'&&!/ターン終了$/.test(l.msg));
    if(kind==='play')cpuTurn?sfx.cpuPlay():sfx.play();
    if(kind==='neg')sfx.negate();
    if(kind==='dmg')fresh.some(l=>l.msg.includes('はらぺこバハムートの攻撃'))?sfx.hara():sfx.hit();
    if(kind==='res'&&fresh.some(l=>l.cls==='hit'&&l.msg.includes('ダメージ')))sfx.hit();
    if(show.length&&!(kind==='endturn'&&cpuTurn))banner(show.map(l=>l.msg));
    if(kind==='dmg'){const el=document.querySelector(cpuTurn?'#youPanel':'#cpuPanel');el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400);}
    if(kind==='endturn'&&cpuTurn){await sleep(300);stale(s);await cpuTurnSummary(s,s.log.slice(turnStart),lifeBefore);stale(s);return;}
    if(cpuTurn&&['play','neg','res','dmg','draw','info'].includes(kind))await sleep((kind==='play'?850:550)+Math.min(1200,Math.max(0,show.length-1)*300));
    else if(['neg','dmg'].includes(kind))await sleep(400);
    stale(s);
  };
  render();
  G.snaps=[];G.startedAt=new Date().toISOString();
  try{
    const w=await runGame(s,[human,G.level===8?makeAI65(true):G.level===7?makeAI6(true):G.level===6?makeAI5(true):G.level===2?makeCPU2():makeCPU()]);
    G.result={w,turns:s.turnCount};
    render();w===0?sfx.win():sfx.lose();saveGame(s,w);
    await showResult();
  }catch(e){if(e.message!=='abort')console.error(e);}
}

const LV_NAME={1:'ふつう',2:'つよい',6:'AI5',7:'AI6',8:'AI6.5'};
function gameSnap(s){return{turn:s.turnCount,player:s.turn,life:s.players.map(p=>p.life),chips:s.players.map(p=>p.chips),stock:s.stock,
  hand:s.players.map(p=>p.hand.map(NAME)),field:s.players.map(p=>p.field.map(NAME)),discard:s.discard.map(NAME),deck:s.deck.length};}
async function saveGame(s,w){
  try{
    if(typeof claude==='undefined'||!claude.use)return;
    const db=await Promise.race([claude.use('db'),new Promise(r=>setTimeout(()=>r(null),10000))]);
    if(!db)return;
    const id=new Date().toISOString().replace(/[-:.TZ]/g,'').slice(0,14)+'-'+Math.random().toString(36).slice(2,6);
    await db.doc('games/'+id).set({startedAt:G.startedAt||null,endedAt:new Date().toISOString(),level:LV_NAME[G.level]||String(G.level),
      rules:!!G.rules,hint:!!G.hint,first:s.first===0?'あなた':'CPU',winner:w===0?'あなた':'CPU',turns:s.turnCount,
      agree:G.stat?{same:G.stat.m,total:G.stat.n,byKind:G.stat.k}:null,
      log:s.log.map(l=>l.cls?l.cls+'|'+l.msg:l.msg),snapshots:G.snaps||[]});
    G.recs=undefined;   // 勝率の表示を読み直す
  }catch(e){console.warn('対戦記録を保存できませんでした',e);}
}
function matchHTML(){const S=G.stat;if(!S||!S.n)return '';const pc=(a,b)=>b?Math.round(a/b*1000)/10:0;
  return `<div class="sum"><div class="play">AIと同じ選択：${S.m} / ${S.n}回（${pc(S.m,S.n)}%）</div>${Object.entries(S.k).map(([k,v])=>`<div>${k}：${v[0]} / ${v[1]}回（${pc(v[0],v[1])}%）</div>`).join('')}</div>`;}
function startScreen(){
  G.s=null;G.awaitPlay=null;render();
  modal(`<div class="title-big">はらぺこ<br>バハムート<br><span style="font-size:16px">vs CPU</span></div>
  <div class="tarts" style="display:flex;gap:6px;margin:6px 0">${[HARA,KODOMO,GOB].map(c=>`<div style="flex:1;height:70px;border:2px solid #151515;background:#fff">${artSVG(c)}</div>`).join('')}</div>
  <p>16枚のカードで戦う2人用対戦ゲーム。CPUは5段階から選べます。</p>
  <div class="btns" id="lv"><button data-l="1">ふつう</button><button data-l="2">つよい</button><button data-l="6">AI5</button><button data-l="7">AI6</button><button data-l="8">AI6.5</button></div>
  <p style="font-size:12px" id="lvtx"></p>
  <p style="font-size:10px;margin:-4px 0 2px;color:#555">バッジ＝あなたとの対戦記録でのCPUの勝率</p>
  <div class="btns"><button data-f="0">先攻</button><button data-f="1">後攻</button><button data-f="r">ランダム</button></div>
  <div class="setrow"><button class="sm" id="hintBtn"></button><span>おすすめの手を青い枠で示す</span></div>
  <div class="setrow"><button class="sm" id="ruleBtn"></button><span>勝ちが確定する手・負けを防ぐ手をルールで決める（AI5〜AI6.5・おすすめに適用）</span></div>
  <div class="btns"><button class="sm" data-r>ルール・カード一覧</button><button class="sm" data-rec>対戦の記録</button></div>`,
  (r,close)=>{const lvTx={1:'ふつう：基本の戦略ルールで打つCPU。',2:'つよい：相手の手札を確率で読み、書の枚数を計算して打つCPU。',6:'AI5：詰み回避・勝ち切りの場面を重点的に練習した。ルールなしでもAI4＋ルールに約55%勝つ。',7:'AI6：AI5から1,000万ステップ超鍛え、勝ち切り・詰み回避を先生役で教えた。AI5に約57%勝つ。',8:'AI6.5（最新）：AI5から3,000万ステップまで鍛え続けた。AI5に約62%、AI6に約56%勝つ。'};
    const badge=(b,w,n)=>{let e=b.querySelector('.bdg');if(!e){e=document.createElement('span');e.className='bdg';b.appendChild(e);}
      e.classList.toggle('none',!n);e.textContent=G.recs===undefined?'…':n?pct(w,n):'--';e.title=n?`${n}局中 CPU ${w}勝`:'記録なし';};
    const showRec=()=>{const L=G.recs||[];
      r.querySelectorAll('[data-l]').forEach(b=>{const st=cpuStat(L,LV_NAME[+b.dataset.l]);badge(b,st.w,st.n);});
      const st=cpuStat(L,LV_NAME[G.level]);
      badge(r.querySelector('[data-f="0"]'),st.fw,st.fn);badge(r.querySelector('[data-f="1"]'),st.sw,st.sn);badge(r.querySelector('[data-f="r"]'),st.w,st.n);};
    const upd=()=>{r.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('pri',+b.dataset.l===G.level));r.querySelector('#lvtx').textContent=lvTx[G.level];showRec();};
    if(G.recs===undefined)loadRecords().then(l=>{G.recs=l;showRec();}).catch(()=>{G.recs=null;showRec();});
    r.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{G.level=+b.dataset.l;upd();});upd();
    const hb=r.querySelector('#hintBtn');const uh=()=>{hb.textContent=G.hint?'AIのおすすめ表示：ON':'AIのおすすめ表示：OFF';hb.classList.toggle('pri',G.hint);};
    hb.onclick=()=>{G.hint=!G.hint;try{localStorage.setItem('hb_hint',G.hint?'on':'off');}catch(e){}uh();};uh();
    const rb=r.querySelector('#ruleBtn');const ur=()=>{rb.textContent=G.rules?'確定手ルール：ON':'確定手ルール：OFF';rb.classList.toggle('pri',G.rules);};
    rb.onclick=()=>{G.rules=!G.rules;try{localStorage.setItem('hb_rules',G.rules?'on':'off');}catch(e){}ur();};ur();
    r.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const v=b.dataset.f;close();startGame(v==='r'?(Math.random()<.5?0:1):+v);});r.querySelector('[data-r]').onclick=showRef;r.querySelector('[data-rec]').onclick=showRecords;});
}
startScreen();
</script>
</body>
</html>
